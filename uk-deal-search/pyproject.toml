[project]
name = "uk-deal-search"
version = "0.1.0"
description = "Find the cheapest NEW price for a product across UK retailers, then stack coupons/cashback."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5", "PyYAML>=6"]

[project.optional-dependencies]
browser = ["playwright>=1.45"]   # for JS-heavy / bot-protected retailers (Currys, AO, John Lewis)
dev = ["pytest>=8"]

[project.scripts]
dealsearch = "dealsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dealsearch"]

[tool.setuptools.package-data]
dealsearch = ["*.yaml"]
