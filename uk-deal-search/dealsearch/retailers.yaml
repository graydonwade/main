  Mark's Electrical: {verdict: LEGIT, checked: 2026-11-14, evidence: "Marks Electrical Ltd 04463433 (AIM-listed group plc 13509635); est. 2002 Leicester; Trustpilot 4.8/~116k. FY26 profit down but £4.4m net cash"}
